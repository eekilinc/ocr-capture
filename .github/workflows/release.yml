name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. tauri.conf.json'dan versiyon oku; tag ve release durumunu hazırla
  # ─────────────────────────────────────────────────────────────────────────────
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versiyonu tauri.conf.json'dan oku
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versiyon: $VERSION"

      - name: Tag yoksa oluştur ve push et
        id: push_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG zaten mevcut."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG oluşturuldu."
          fi

      - name: Release'i önceden oluştur veya varsa eski asset'leri temizle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG oluşturuluyor..."
            gh release create "$TAG" --title "Metin Yakalayıcı $TAG" --notes "Metin Yakalayıcı $TAG sürümü" || true
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Platformlara göre derleme ve release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    needs: create-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            rust-targets: 'x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      # ── LINUX ────────────────────────────────────────────────────────────────
      - name: Linux sistem bağımlılıklarını kur
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            tesseract-ocr \
            tesseract-ocr-tur \
            tesseract-ocr-eng \
            pkg-config \
            libclang-dev \
            libssl-dev \
            libx11-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev

      # ── MACOS ────────────────────────────────────────────────────────────────
      - name: macOS Tesseract kur
        if: matrix.platform == 'macos-latest'
        run: brew install tesseract tesseract-lang

      # ── WINDOWS ──────────────────────────────────────────────────────────────
      - name: Windows Tesseract kur (Chocolatey)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          choco install tesseract --yes
          $tessPath = "C:\Program Files\Tesseract-OCR"
          echo "$tessPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "TESSERACT_PATH=$tessPath\tesseract.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Windows Türkçe dil paketini kur
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/tur.traineddata" `
            -OutFile "$tessdata\tur.traineddata"
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata" `
            -OutFile "$tessdata\eng.traineddata"

      # ── NODE & RUST ──────────────────────────────────────────────────────────
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── BUILD ────────────────────────────────────────────────────────────────
      - name: Frontend bağımlılıklarını yükle
        run: npm install

      - name: Uygulamayı derle ve Release oluştur
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: '1'
        with:
          tagName: v${{ needs.create-tag.outputs.version }}
          releaseName: 'Metin Yakalayıcı v${{ needs.create-tag.outputs.version }}'
          releaseBody: |
            ## Metin Yakalayıcı v${{ needs.create-tag.outputs.version }}

            ### Kurulum

            | Platform | Dosya | Açıklama |
            |---|---|---|
            | Windows | `*_x64-setup.exe` | NSIS Kurulum Sihirbazı (Önerilen) |
            | macOS | `*_universal.dmg` | macOS Universal (Apple Silicon & Intel) |
            | Linux | `*.deb` | Debian/Ubuntu Paketi |
            | Linux | `*.AppImage` | Taşınabilir Linux Uygulaması |

            > **Not:** Windows'ta OCR özelliğini kullanabilmek için [Tesseract-OCR](https://github.com/UB-Mannheim/tesseract/wiki) kurulu olması gerekmektedir.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
